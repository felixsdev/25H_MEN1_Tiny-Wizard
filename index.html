<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>Tiny Wizard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/img/favicon.png"/>

    <!-- Stylesheet -->
    <link rel="stylesheet" type="text/css" href="style.css"> 

    <!-- Main game file -->
    <script src="sketch.js" defer></script>

    <!-- Libraries -->
    <script src="scripts/lib/p5.min.js"></script>
    <script src="scripts/lib/p5.touchgui.js"></script>
    <script src="scripts/lib/p5.sound.min.js"></script>

    <!-- Classes -->
    <script src="scripts/classes/wall.js"></script>
    <script src="scripts/classes/floor.js"></script>
    <script src="scripts/classes/projectile.js"></script>
    <script src="scripts/classes/enemy.js"></script>
    <script src="scripts/classes/player.js"></script>

    <!-- Systems -->
    <script src="scripts/systems/collision.js"></script>
    <script src="scripts/systems/controls.js"></script>

    <!-- Game States -->
    <script src="scripts/gamestates/loading.js"></script>
    <script src="scripts/gamestates/lose.js"></script>
    <script src="scripts/gamestates/running.js"></script>
    <script src="scripts/gamestates/selector.js"></script>
    <script src="scripts/gamestates/win.js"></script>
  </head>
  <body>
    <header>
      <!-- Title -->
      <img src="assets/img/title-border.png" id="title-img-top">
      <h1>Tiny Wizard</h1>
    </header>
    <main>
      <!-- p5.js canvas -->
      <canvas id="game-container"></canvas>
      <!-- Controls Info -->
    <div id="controls-info">
      <h2>Controls</h2>
      <p>Move: WASD</p>
      <p>Shoot: Left Mouse Button</p>
      <p>Mute/Unmute Audio: M</p>
      <p>Reload Level: R</p>
      <p>Return to Level Selector: ESC</p>
    </div>
    </main>
    <footer>
      <p>Made by Felix Steiner</p>
    </footer>
  </body>
  
</html>
